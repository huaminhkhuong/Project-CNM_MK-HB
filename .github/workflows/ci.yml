name: CI

on:
  push:
    branches: ["main", "develop"]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: cnm_mk_hb
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DATABASE_URL: mysql://root:root@127.0.0.1:3306/cnm_mk_hb
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: cnm_mk_hb
      JWT_ACCESS_SECRET: ci_access_secret
      JWT_REFRESH_SECRET: ci_refresh_secret
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      FRONTEND_URL: http://localhost:5173
      RUN_API_INTEGRATION: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Generate Prisma client & sync database
        run: |
          npm run prisma:generate -w services/api
          npm run prisma:push -w services/api

      - name: Seed production accounts
        run: npm run seed:production -w services/api

      - name: Build
        run: npm run build

      - name: Test API
        run: |
          npm test -w services/api 2>&1 | tee test-output.log || {
            echo "### ❌ Test API Failed Output" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat test-output.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          }

  deploy-to-ec2:
    name: Deploy to AWS EC2
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: 🔐 SSH & Deploy to AWS EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT || 22 }}
          script_stop: true
          script: |
            echo "🚀 [1/5] Bắt đầu kết nối và triển khai trên EC2..."
            PROJECT_DIR="/home/${{ secrets.EC2_USER }}/Khoa_luan"
            
            if [ ! -d "$PROJECT_DIR" ]; then
              echo "❌ Thư mục $PROJECT_DIR không tồn tại. Vui lòng clone repo vào $PROJECT_DIR trước."
              exit 1
            fi
            
            cd "$PROJECT_DIR"

            echo "📥 [2/5] Kéo mã nguồn mới nhất từ nhánh main..."
            git pull origin main

            echo "📁 [3/5] Đảm bảo các thư mục dữ liệu tồn tại..."
            mkdir -p data/images services/api/uploads services/api/src/data logs/nginx nginx/ssl

            echo "🐳 [4/5] Build và khởi chạy Docker Compose Production..."
            docker compose -f docker-compose.prod.yml up -d --build

            echo "🧹 [5/5] Dọn dẹp Docker images cũ (dangling) để tiết kiệm dung lượng đĩa..."
            docker image prune -f

            echo "✅ Trạng thái các dịch vụ đang chạy:"
            docker compose -f docker-compose.prod.yml ps
