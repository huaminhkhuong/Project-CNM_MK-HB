services:
  mysql:
    image: mysql:8.0
    container_name: cnm_mysql_prod
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-password}
      MYSQL_DATABASE: ${DB_NAME:-cnm_mk_hb}
      MYSQL_USER: ${DB_USER:-cnm_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-password}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_prod_data:/var/lib/mysql
    networks:
      - cnm_network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD:-password}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: cnm_phpmyadmin_prod
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_ARBITRARY: 0
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - cnm_network

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    container_name: cnm_api_prod
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: mysql://${DB_USER:-root}:${DB_PASSWORD:-password}@mysql:3306/${DB_NAME:-cnm_mk_hb}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-cnm_mk_hb}
      DB_USER: ${DB_USER:-root}
      DB_PASSWORD: ${DB_PASSWORD:-password}
      PORT: 4000
      FRONTEND_URL: ${FRONTEND_URL:-https://yourdomain.com}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      VNPAY_TMN_CODE: ${VNPAY_TMN_CODE}
      VNPAY_HASH_SECRET: ${VNPAY_HASH_SECRET}
      VNPAY_URL: ${VNPAY_URL}
      PAYMENT_MOCK_MODE: ${PAYMENT_MOCK_MODE:-false}
      SHIPPING_MOCK_MODE: ${SHIPPING_MOCK_MODE:-false}
      SHIPPING_PROVIDER: ${SHIPPING_PROVIDER:-ghtk}
      CHAT_STORAGE_PATH: /app/data/chat-sessions.json
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
    volumes:
      - ./services/api/data:/app/data
      - ./services/api/uploads:/app/services/api/uploads
    networks:
      - cnm_network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:4000/api/health',(res)=>process.exit(res.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_BASE_URL: ${API_BASE_URL:-https://yourdomain.com/api}
    container_name: cnm_web_prod
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    networks:
      - cnm_network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:5173/"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  nginx:
    image: nginx:alpine
    container_name: cnm_nginx_prod
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./logs/nginx:/var/log/nginx
    depends_on:
      - api
      - web
    networks:
      - cnm_network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  mysql_prod_data:

networks:
  cnm_network:
    driver: bridge
