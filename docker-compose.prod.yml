version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: cnm_mysql_prod
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_strong_password_here}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-cnm_mk_hb}
      MYSQL_USER: ${MYSQL_USER:-cnm_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-user_strong_password_here}
    volumes:
      - mysql_data:/var/lib/mysql
      # Auto-import 140 products, categories, specs, compatibility rules on first run
      - ./database/cnm_mk_hb_dump.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - cnm_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root_strong_password_here}"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    container_name: cnm_api_prod
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=4000
      - DATABASE_URL=mysql://${MYSQL_USER:-cnm_user}:${MYSQL_PASSWORD:-user_strong_password_here}@mysql:3306/${MYSQL_DATABASE:-cnm_mk_hb}
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - JWT_ACCESS_EXPIRES_IN=${JWT_ACCESS_EXPIRES_IN:-15m}
      - JWT_REFRESH_EXPIRES_IN=${JWT_REFRESH_EXPIRES_IN:-7d}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost}
      - LLM_PROVIDER=${LLM_PROVIDER:-gemini}
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_MODEL=${LLM_MODEL:-gemini-1.5-flash}
      - DATA_IMAGES_DIR=/app/data/images
      - UPLOADS_DIR=/app/services/api/uploads
      - CHAT_STORAGE_PATH=/app/data/chat-sessions.json
      - AI_SERVICE_URL=http://ai-service:5001
    volumes:
      # Persistent storage for product images and uploads
      - ./data/images:/app/data/images:ro
      - ./services/api/uploads:/app/services/api/uploads
      # Persistent AI rules store so hitCounts and new rules persist across deployments
      - ./services/api/src/data:/app/services/api/src/data
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - cnm_network

  ai-service:
    build:
      context: ./services/ai-service
      dockerfile: Dockerfile
    container_name: cnm_ai_service_prod
    restart: always
    environment:
      - PORT=5001
    volumes:
      - ./services/ai-service/data_store:/app/data_store
      - ./data:/app/data:ro
      - ./services/api/src/data:/app/services/api/src/data:ro
    networks:
      - cnm_network
    deploy:
      resources:
        limits:
          memory: 500M

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # Relative API base URL works seamlessly behind Nginx on any IP or domain
        - VITE_API_BASE_URL=/api
    container_name: cnm_web_prod
    restart: always
    depends_on:
      - api
    networks:
      - cnm_network

  nginx:
    image: nginx:alpine
    container_name: cnm_nginx_prod
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.http.conf:/etc/nginx/nginx.conf:ro
      - ./data/images:/var/www/data/images:ro
      - ./services/api/uploads:/var/www/uploads:ro
    depends_on:
      - api
      - web
    networks:
      - cnm_network

volumes:
  mysql_data:

networks:
  cnm_network:
    driver: bridge
