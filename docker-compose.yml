version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: cnm_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: cnm_mk_hb
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/cnm_mk_hb_dump.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: cnm_phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_ARBITRARY: 1
    ports:
      - "8080:80"
    depends_on:
      mysql:
        condition: service_healthy

  backend:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    container_name: cnm_api
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=development
      - PORT=4000
      - DATABASE_URL=mysql://root:root@mysql:3306/cnm_mk_hb
      - JWT_ACCESS_SECRET=dev_jwt_access_secret_key_32_characters_minimum
      - JWT_REFRESH_SECRET=dev_jwt_refresh_secret_key_32_characters_minimum
      - FRONTEND_URL=http://localhost:5173
      - DATA_IMAGES_DIR=/app/data/images
      - AI_SERVICE_URL=http://ai-service:5001
    volumes:
      - ./data/images:/app/data/images:ro
      - ./services/api/uploads:/app/services/api/uploads
      - ./services/api/src/data:/app/services/api/src/data
    depends_on:
      mysql:
        condition: service_healthy

  ai-service:
    build:
      context: ./services/ai-service
      dockerfile: Dockerfile
    container_name: cnm_ai_service
    restart: unless-stopped
    ports:
      - "5001:5001"
    environment:
      - PORT=5001
    volumes:
      - ./services/ai-service/data_store:/app/data_store
      - ./data:/app/data:ro
      - ./services/api/src/data:/app/services/api/src/data:ro

  frontend:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        - VITE_API_BASE_URL=http://localhost:4000/api
    container_name: cnm_web
    restart: unless-stopped
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  mysql_data:
